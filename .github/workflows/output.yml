name: Output

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rs-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run pipeline
        run: |
          python stock_data.py
          python rs_ranking.py
          python screener.py
          python market_monitor.py

      - name: Run theme analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python theme_analysis.py

      - name: Commit output files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stock_ticker.csv stock_rs.csv industry_rs.csv  
          git add output/technical_watchlist.csv output/watchlist.csv output/hot_themes.csv output/market_monitor.csv 
          git add output/technical_watchlist.txt output/watchlist.txt output/hot_theme_watchlist.txt 
          git commit -m "Daily Update" || echo "No changes to commit"
          git push
