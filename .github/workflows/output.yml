name: Output

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rs-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run screener pipeline
        run: |
          python stock_data.py
          python rs_ranking.py
          python screener.py

      - name: Run theme screener
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python theme_screener.py

      - name: Commit output files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stock_ticker.csv stock_data_rs.csv csv/technical_watchlist.csv txt/technical_watchlist.txt txt/watchlist.txt csv/watchlist_summary.csv
          git commit -m "Daily Update" || echo "No changes to commit"
          git push
