name: Output
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rs-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run stock_data.py
        run: python stock_data.py

      - name: Run rs_ranking.py
        run: python rs_ranking.py

      - name: Run screener.py
        run: python screener.py

      - name: Run market_monitor.py
        run: python market_monitor.py

      - name: Run fetch_news.py
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python fetch_news.py

      - name: Run hot_themes.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python hot_theme.py

      - name: Run theme_analysis.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          until python theme_analysis.py; do
            echo "⚠️ theme_analysis.py 未完成，30 秒後重試..."
            sleep 30
          done

      - name: Commit output files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add stock_ticker.csv stock_rs.csv industry_rs.csv
          git add output/technical_watchlist.csv output/watchlist.csv output/hot_themes.csv output/market_monitor.csv
          git add output/technical_watchlist.txt output/watchlist.txt output/hot_theme_watchlist.txt
          git commit -m "Daily Update" || echo "No changes to commit"
          git push
